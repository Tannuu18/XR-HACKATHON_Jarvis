name: Track 3 checks
on: [push, pull_request]
jobs:
  estimator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - run: python main.py examples/synthetic/imu.csv estimated_trajectory.txt --metadata metadata.json
      - run: python tools/validate_output.py examples/synthetic/imu.csv estimated_trajectory.txt
      - run: python tools/package_submission.py examples/synthetic/imu.csv estimated_trajectory.txt --metadata metadata.json
