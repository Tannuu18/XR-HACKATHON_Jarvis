name: Track 3 checks
on: [push, pull_request]
jobs:
  estimator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test final estimator
        working-directory: submission/Jarvis_Final_Submission
        run: python -m unittest discover -s tests -v
      - name: Verify final output contract
        working-directory: submission/Jarvis_Final_Submission
        run: |
          python src/main.py examples/synthetic/imu.csv estimated_trajectory.txt --metadata metadata.json
          python tools/validate_output.py examples/synthetic/imu.csv estimated_trajectory.txt
